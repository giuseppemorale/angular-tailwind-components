# Ad ogni push su develop con versione *-SNAPSHOT in package.json,
# crea un tag incrementale vM.m.p-SNAPSHOT-{i} sul commit corrente.
# Durante le RC (versione *-RCn) non crea tag.
# Per saltare un push: includere [skip snapshot] nel messaggio di commit.

name: Develop snapshot tag

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  tag-snapshot:
    runs-on: ubuntu-latest
    if: >-
      github.event.head_commit == null ||
      !contains(github.event.head_commit.message, '[skip snapshot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ ! "$VERSION" =~ -SNAPSHOT$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Versione non SNAPSHOT (${VERSION}): nessun tag snapshot."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            BASE="${VERSION%-SNAPSHOT}"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push snapshot tag
        if: steps.version.outputs.skip == 'false'
        env:
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          PREFIX="v${BASE}-SNAPSHOT"

          MAX=0
          for tag in $(git tag -l "${PREFIX}-*"); do
            suffix="${tag#${PREFIX}-}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && (( suffix > MAX )); then
              MAX=$suffix
            fi
          done

          if (( MAX > 0 )); then
            LATEST="${PREFIX}-${MAX}"
            if git rev-parse "$LATEST" >/dev/null 2>&1; then
              if [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$LATEST")" ]]; then
                echo "Commit già taggato come ${LATEST}, skip."
                exit 0
              fi
            fi
          fi

          NEXT=$((MAX + 1))
          NEW_TAG="${PREFIX}-${NEXT}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Creato e pushato ${NEW_TAG}"
