name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "::error::Il tag non punta a un commit presente su master. Pubblicazione annullata."
            exit 1
          fi
          echo "Commit ${{ github.sha }} è su master — ok per pubblicare."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use npm from packageManager (OIDC requires npm >= 11.5.1)
        run: corepack enable && corepack prepare npm@11.13.0 --activate && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version ${VERSION} via Trusted Publishing (OIDC)..."
          cd dist/angular-tailwind-components
          if echo "$VERSION" | grep -qiE '-RC[0-9]+$'; then
            npm publish --access public --tag rc
          else
            npm publish --access public
          fi
