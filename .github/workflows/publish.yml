name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "::error::Il tag non punta a un commit presente su master. Pubblicazione annullata."
            exit 1
          fi
          echo "Commit ${{ github.sha }} è su master — ok per pubblicare."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: 'npm'

      - name: Use npm from packageManager (OIDC requires npm >= 11.5.1)
        run: corepack enable && corepack prepare npm@11.13.0 --activate && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify package metadata for Trusted Publishing
        run: |
          node -e "
            const pkg = require('./dist/angular-tailwind-components/package.json');
            const url = pkg.repository?.url || '';
            if (!url.includes('giuseppemorale/angular-tailwind-components')) {
              throw new Error('repository.url mancante o errato: ' + url);
            }
            console.log('repository.url:', url);
          "

      - name: Check OIDC is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::OIDC non disponibile. Verifica permissions.id-token: write sul job."
            exit 1
          fi
          echo "OIDC disponibile per Trusted Publishing."

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          unset NODE_AUTH_TOKEN
          rm -f .npmrc ~/.npmrc "${GITHUB_WORKSPACE}/.npmrc" 2>/dev/null || true

          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version ${VERSION} via Trusted Publishing (OIDC)..."

          cd dist/angular-tailwind-components
          if echo "$VERSION" | grep -qiE '-RC[0-9]+$'; then
            npm publish --access public --tag rc
          else
            npm publish --access public
          fi
