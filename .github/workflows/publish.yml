name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "::error::Il tag non punta a un commit presente su master. Pubblicazione annullata."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: 'npm'

      - name: Upgrade npm (Trusted Publishing richiede npm >= 11.5.1)
        run: |
          npm install -g npm@11.13.0
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify package metadata
        run: |
          node -e "
            const pkg = require('./dist/angular-tailwind-components/package.json');
            console.log('repository:', JSON.stringify(pkg.repository));
            if (!pkg.repository?.url?.includes('giuseppemorale/angular-tailwind-components')) {
              process.exit(1);
            }
          "

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" || (echo "::error::OIDC non disponibile" && exit 1)
          unset NODE_AUTH_TOKEN
          rm -f .npmrc ~/.npmrc
          cd dist/angular-tailwind-components
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing ${VERSION}..."
          if echo "$VERSION" | grep -qiE '-RC[0-9]+$'; then
            npm publish --access public --tag rc
          else
            npm publish --access public
          fi
