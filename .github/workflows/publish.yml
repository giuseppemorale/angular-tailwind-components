# Trusted Publishing: https://docs.npmjs.com/trusted-publishers
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "::error::Il tag non punta a un commit presente su master."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify package metadata for Trusted Publishing
        run: |
          node -e "
            const pkg = require('./dist/angular-tailwind-components/package.json');
            const url = pkg.repository?.url || '';
            console.log('repository.url:', url);
            if (!url.includes('github.com/giuseppemorale/angular-tailwind-components')) {
              throw new Error('repository.url must match GitHub repo');
            }
          "

      - name: Publish to npm
        working-directory: dist/angular-tailwind-components
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing ${VERSION}..."
          if echo "$VERSION" | grep -qiE '-RC[0-9]+$'; then
            npm publish --tag rc
          else
            npm publish
          fi
