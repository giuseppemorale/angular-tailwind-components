name: Publish to npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "::error::Il tag non punta a un commit presente su master. Pubblicazione annullata."
            exit 1
          fi
          echo "Commit ${{ github.sha }} è su master — ok per pubblicare."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use npm from packageManager
        run: corepack enable && corepack prepare npm@11.13.0 --activate && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Secret NPM_TOKEN mancante. Crea un Granular Access Token su npmjs.com e aggiungilo in GitHub → Settings → Secrets."
            exit 1
          fi
          npm whoami

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version ${VERSION}..."
          cd dist/angular-tailwind-components
          if echo "$VERSION" | grep -qiE '-RC[0-9]+$'; then
            npm publish --access public --tag rc
          else
            npm publish --access public
          fi
