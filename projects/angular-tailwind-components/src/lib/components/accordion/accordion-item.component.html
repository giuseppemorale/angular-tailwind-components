<div [id]="id()" [class]="mergeClasses('border-b border-neutral-200 last:border-b-0')">
  <button
    type="button"
    (click)="toggle()"
    class="flex items-center justify-between w-full px-5 py-4 text-left text-sm font-medium text-neutral-800 hover:bg-neutral-50 transition-colors cursor-pointer"
    [attr.aria-expanded]="isExpanded()">
    <span>{{ title() }}</span>
    <tailwind-icon
      icon="chevron-down"
      [size]="16"
      class="text-neutral-400 transition-transform duration-200"
      [class.rotate-180]="isExpanded()" />
  </button>
  @if (isExpanded()) {
    <div class="px-5 py-4 text-sm text-neutral-600">
      <ng-content />
    </div>
  }
</div>
