@if (!dismissed()) {
  <div [class]="computedClasses()" role="alert" [attr.aria-live]="color() === 'red' ? 'assertive' : 'polite'">
    <div class="shrink-0 mt-0.5">
      <tailwind-icon [icon]="alertIcon()" [size]="20" />
    </div>

    <div class="flex-1 min-w-0">
      @if (title()) {
        <h3 class="text-sm font-semibold mb-0.5">{{ title() }}</h3>
      }
      <div class="text-sm">
        <ng-content />
      </div>
    </div>

    @if (dismissible()) {
      <tailwind-button
        kind="ghost"
        color="neutral"
        size="sm"
        icon="x-mark"
        class="shrink-0 -m-1 opacity-70 hover:opacity-100"
        ariaLabel="Dismiss alert"
        (onClick)="dismiss()" />
    }
  </div>
}
