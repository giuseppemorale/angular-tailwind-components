@if (!dismissed()) {
  <div [class]="computedClasses()" role="alert" [attr.aria-live]="severity() === 'danger' ? 'assertive' : 'polite'">
    <!-- Icon -->
    <div class="shrink-0 mt-0.5">
      @switch (severity()) {
        @case ('success') {
          <tailwind-icon icon="check-circle" [size]="20" />
        }
        @case ('warning') {
          <tailwind-icon icon="exclamation-triangle" [size]="20" />
        }
        @case ('danger') {
          <tailwind-icon icon="x-circle" [size]="20" />
        }
        @case ('info') {
          <tailwind-icon icon="information-circle" [size]="20" />
        }
      }
    </div>

    <!-- Content -->
    <div class="flex-1 min-w-0">
      @if (title()) {
        <h3 class="text-sm font-semibold mb-0.5">{{ title() }}</h3>
      }
      <div class="text-sm">
        <ng-content />
      </div>
    </div>

    <!-- Dismiss button -->
    @if (dismissible()) {
      <tailwind-button
        kind="ghost"
        color="transparent"
        size="sm"
        icon="x-mark"
        class="shrink-0 -m-1 opacity-70 hover:opacity-100"
        ariaLabel="Dismiss alert"
        (onClick)="dismiss()" />
    }
  </div>
}
