<button
  [ngClass]="computedClasses()"
  [disabled]="isDisabled()"
  [type]="type()"
  [attr.role]="role() === 'button' ? null : role()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-current]="ariaCurrent() ?? null"
  [attr.aria-pressed]="ariaPressed() === undefined ? null : ariaPressed() ? 'true' : 'false'">
  <span class="inline-flex min-w-0 items-center justify-center gap-2">
    @if (loading()) {
      <tailwind-icon icon="arrow-path" [size]="iconPixelSize()" class="shrink-0 animate-spin" />
    } @else if (icon() && iconPosition() === 'left') {
      <tailwind-icon [icon]="icon()!" [size]="iconPixelSize()" class="shrink-0" />
    }
    <span class="tailwind-button-label inline-flex min-w-0 items-center empty:hidden">
      <ng-content />
    </span>
    @if (!loading() && icon() && iconPosition() === 'right') {
      <tailwind-icon [icon]="icon()!" [size]="iconPixelSize()" class="shrink-0" />
    }
  </span>
</button>
