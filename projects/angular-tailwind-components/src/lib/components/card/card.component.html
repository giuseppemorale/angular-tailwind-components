<div [class]="shellClasses()">
  @if (hasHeader()) {
    <!-- Header slot (always rendered; only visible when content is projected) -->
    <div class="px-6 pt-4 pb-2 border-b border-neutral-100 shrink-0" [class.bg-neutral-50]="headerBg()">
      <ng-content select="[tailwind-card-header]" />
    </div>
  }

  <!-- Image slot -->
  <ng-content select="[tailwind-card-image]" />

  <!-- Body -->
  <div class="p-6 flex-1 min-h-0">
    <ng-content />
  </div>

  @if (hasFooter()) {
    <!-- Footer slot -->
    <div class="px-6 py-4 border-t border-neutral-100 bg-neutral-50/50 shrink-0">
      <ng-content select="[tailwind-card-footer]" />
    </div>
  }
</div>
