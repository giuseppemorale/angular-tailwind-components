<div [class]="mergeClasses('inline-flex items-center gap-2.5 select-none')" [class.opacity-50]="isDisabled()">
  <label
    [class]="labelClasses()"
    [class.cursor-pointer]="!isDisabled()"
    [class.cursor-not-allowed]="isDisabled()"
    [attr.for]="subId('inner')">
    <input
      [attr.id]="subId('inner')"
      type="checkbox"
      class="peer sr-only"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="isDisabled()"
      [attr.aria-checked]="ariaChecked()"
      [attr.aria-describedby]="description() ? subId('desc') : null"
      [attr.aria-labelledby]="label() ? subId('label') : null"
      [attr.aria-label]="label() ? null : ariaLabel() || null"
      (change)="onCheckboxChange($event)" />
    <div
      class="size-full rounded-control-inner border-2 flex items-center justify-center transition-[color,background-color,border-color,box-shadow] duration-150 ease-in-out peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-ring"
      [class.border-border-strong]="!isFilled()"
      [class.bg-surface]="!isFilled()"
      [class.border-primary-600]="isFilled()"
      [class.bg-primary-600]="isFilled()">
      @if (indeterminate()) {
        <tailwind-icon icon="minus" [size]="checkIconSize()" class="text-white shrink-0" />
      } @else if (checked()) {
        <tailwind-icon icon="check" [size]="checkIconSize()" class="text-white shrink-0" />
      }
    </div>
  </label>

  <div class="flex flex-col gap-0.5 pt-0.5">
    @if (label()) {
      <span [attr.id]="subId('label')" class="text-sm font-medium text-neutral-800 leading-tight">{{ label() }}</span>
    }
    @if (description()) {
      <span [attr.id]="subId('desc')" class="text-xs text-fg-muted leading-snug">
        {{ description() }}
      </span>
    }
  </div>
</div>
