<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [attr.for]="id() ? id() + '-inner' : null" class="text-sm font-medium text-neutral-700">{{ label() }}</label>
  }
  <div class="relative">
    <input
      [attr.id]="id() ? id() + '-inner' : null"
      type="text"
      readonly
      [value]="displayValue()"
      [placeholder]="effectivePlaceholder()"
      class="block w-full bg-white border border-neutral-300 rounded-md px-3 py-2 text-sm text-neutral-900 placeholder:text-neutral-400 outline-none focus:outline focus:outline-neutral-500 focus:outline-offset-2 cursor-pointer disabled:bg-neutral-50 disabled:cursor-not-allowed pr-10"
      [disabled]="isDisabled()"
      (click)="toggleCalendar()" />
    <tailwind-icon
      icon="calendar-days"
      [size]="16"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none" />
  </div>

  @if (showCalendar()) {
    <div class="absolute z-popover mt-1 bg-white rounded-xl border border-neutral-200 shadow-xl p-4 w-72">
      <!-- Month/Year nav -->
      <div class="flex items-center justify-between mb-3">
        <tailwind-button
          kind="ghost"
          color="neutral" kind="text"
          size="sm"
          icon="chevron-left"
          ariaLabel="Previous month"
          (onClick)="prevMonth()" />
        <span class="text-sm font-semibold text-neutral-800">{{ monthYearLabel() }}</span>
        <tailwind-button
          kind="ghost"
          color="neutral" kind="text"
          size="sm"
          icon="chevron-right"
          ariaLabel="Next month"
          (onClick)="nextMonth()" />
      </div>
      <!-- Weekdays -->
      <div class="grid grid-cols-7 gap-0 mb-1">
        @for (day of weekDays; track $index) {
          <div class="text-center text-xs font-medium text-neutral-400 py-1">{{ day }}</div>
        }
      </div>
      <!-- Days -->
      <div class="grid grid-cols-7 gap-0">
        @for (day of calendarDays(); track $index) {
          @if (day === 0) {
            <div></div>
          } @else {
            <button
              type="button"
              (click)="selectDay(day)"
              class="h-8 w-8 mx-auto rounded-lg text-sm transition-colors cursor-pointer hover:bg-neutral-100"
              [class.bg-neutral-600]="isSelected(day)"
              [class.text-white]="isSelected(day)"
              [class.hover:bg-neutral-700]="isSelected(day)"
              [class.text-neutral-700]="!isSelected(day) && !isToday(day)"
              [class.font-semibold]="isToday(day)"
              [class.text-neutral-600]="isToday(day) && !isSelected(day)">
              {{ day }}
            </button>
          }
        }
      </div>
      <div class="mt-2 pt-2 border-t border-neutral-100 flex items-center justify-between gap-2">
        <tailwind-button
          kind="text"
          color="blue"
          size="xs"
          [disabled]="isDisabled()"
          (onClick)="goToToday()">
          {{ i18n.today }}
        </tailwind-button>
        <tailwind-button
          kind="solid"
          color="blue"
          size="sm"
          [disabled]="isDisabled() || !draft()"
          (onClick)="apply()">
          {{ i18n.confirm }}
        </tailwind-button>
      </div>
    </div>
  }
</div>
