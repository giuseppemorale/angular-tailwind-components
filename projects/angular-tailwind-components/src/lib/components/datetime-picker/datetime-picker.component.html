<div [class]="mergeClasses('flex flex-col gap-1.5')">
  @if (label()) {
    <label [attr.for]="subId('inner')" class="text-sm font-medium text-neutral-700">{{ label() }}</label>
  }
  <div class="relative">
    <input
      [attr.id]="subId('inner')"
      type="text"
      readonly
      [value]="displayValue()"
      [placeholder]="effectivePlaceholder()"
      class="block w-full bg-surface border border-border-strong field-depth rounded-control h-9 px-3 text-sm text-fg placeholder:text-neutral-400 transition-[color,background-color,border-color,box-shadow] duration-150 ease-in-out outline-none focus:outline-2 focus:outline-offset-2 focus:outline-ring focus:border-ring cursor-pointer disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-fg-muted pr-10"
      [disabled]="isDisabled()"
      (click)="togglePanel()" />
    <tailwind-icon
      icon="calendar-days"
      [size]="16"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none" />

    @if (showPanel()) {
      <div
        class="absolute left-0 top-full z-popover mt-1 w-80 max-w-full rounded-overlay border border-border bg-surface p-4 shadow-xl animate-overlay-in">
        <tailwind-calendar-panel
          [calendarView]="calendarView()"
          (calendarViewChange)="calendarView.set($event)"
          [viewMonth]="viewMonth()"
          (viewMonthChange)="viewMonth.set($event)"
          [viewYear]="viewYear()"
          (viewYearChange)="viewYear.set($event)"
          [highlightDate]="draft()"
          [minDate]="minDate()"
          [maxDate]="maxDate()"
          (daySelect)="selectDay($event)" />
        <div class="mt-3 pt-3 border-t border-neutral-100 flex items-center gap-2">
          <span class="text-xs font-medium text-neutral-600 shrink-0">{{ i18n.time }}</span>
          <select
            class="flex-1 min-w-0 block bg-surface border border-border-strong field-depth rounded-control h-9 px-2 text-sm text-fg tabular-nums transition-[color,background-color,border-color,box-shadow] duration-150 ease-in-out outline-none focus:outline-2 focus:outline-offset-2 focus:outline-ring focus:border-ring disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-fg-muted"
            [disabled]="isDisabled() || !draft()"
            (change)="onHourChange($event)">
            @for (h of hours; track h) {
              <option [value]="h" [selected]="h === (draft()?.getHours() ?? 0)">
                {{ h.toString().padStart(2, '0') }}
              </option>
            }
          </select>
          <span class="text-neutral-400 text-sm">:</span>
          <select
            class="flex-1 min-w-0 block bg-surface border border-border-strong field-depth rounded-control h-9 px-2 text-sm text-fg tabular-nums transition-[color,background-color,border-color,box-shadow] duration-150 ease-in-out outline-none focus:outline-2 focus:outline-offset-2 focus:outline-ring focus:border-ring disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-fg-muted"
            [disabled]="isDisabled() || !draft()"
            (change)="onMinuteChange($event)">
            @for (m of minutes; track m) {
              <option [value]="m" [selected]="m === (draft()?.getMinutes() ?? 0)">
                {{ m.toString().padStart(2, '0') }}
              </option>
            }
          </select>
        </div>
        <div class="mt-2 pt-2 border-t border-neutral-100 flex items-center justify-between gap-2">
          <tailwind-button
            kind="text"
            [color]="isTodaySelectable() ? 'primary' : 'secondary'"
            size="xs"
            [disabled]="isDisabled() || !isTodaySelectable()"
            (click)="goToToday()">
            {{ i18n.today }}
          </tailwind-button>
          <tailwind-button kind="solid" color="primary" [disabled]="isDisabled() || !draft()" (click)="apply()">
            {{ i18n.confirm }}
          </tailwind-button>
        </div>
      </div>
    }
  </div>
</div>
