@if (isOpen()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-black/40 backdrop-blur-sm z-1040 transition-opacity duration-300"
    [class.opacity-100]="isVisible()"
    [class.opacity-0]="!isVisible()"
    (click)="closeOnBackdrop() && close()"
    aria-hidden="true"></div>

  <!-- Drawer Panel -->
  <div
    #drawerPanel
    [class]="panelClasses()"
    role="dialog"
    tabindex="-1"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    [attr.aria-modal]="true"
    [attr.aria-labelledby]="title() ? subId('title') : null"
    [attr.aria-label]="title() ? null : ariaLabel() || null"
    (keydown.escape)="closeOnEscape() && close()">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-neutral-200">
      @if (title()) {
        <h2 [attr.id]="subId('title')" class="text-lg font-semibold text-neutral-900">{{ title() }}</h2>
      }
      @if (showCloseButton()) {
        <tailwind-button
          kind="ghost"
          color="transparent"
          icon="x-mark"
          class="ml-auto shrink-0 -m-1.5"
          [ariaLabel]="resolvedCloseLabel()"
          (onClick)="close()" />
      }
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto px-6 py-5">
      <ng-content />
    </div>

    <!-- Footer -->
    <ng-content select="[tailwind-drawer-footer]" />
  </div>
}
