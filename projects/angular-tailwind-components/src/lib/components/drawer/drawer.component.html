<ng-template #panelTemplate>
  <div
    #drawerPanel
    [class]="panelClasses()"
    role="dialog"
    tabindex="-1"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    [attr.aria-modal]="true"
    [attr.aria-labelledby]="title() ? subId('title') : null"
    [attr.aria-label]="title() ? null : ariaLabel() || null">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-border">
      @if (title()) {
        <h2 [attr.id]="subId('title')" class="text-lg font-semibold tracking-tight text-fg">{{ title() }}</h2>
      }
      @if (showCloseButton()) {
        <tailwind-button
          kind="ghost"
          color="transparent"
          icon="x-mark"
          class="ml-auto shrink-0 -m-1.5"
          [ariaLabel]="resolvedCloseLabel()"
          (click)="close()" />
      }
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto px-6 py-5">
      <ng-content />
    </div>

    <!-- Footer -->
    <ng-content select="[tailwind-drawer-footer]" />
  </div>
</ng-template>
