<div
  class="tailwind-editor-toolbar flex flex-wrap items-center gap-1 p-2 border-b border-neutral-200 bg-neutral-50/80"
  role="toolbar"
  [attr.aria-disabled]="disabled() || null">
  @for (group of groups(); track $index; let lastGroup = $last) {
    <div class="flex flex-wrap items-center gap-0.5">
      @for (item of group.items; track item.kind === 'button' ? item.command : 'headingSelect') {
        @if (item.kind === 'headingSelect') {
          <tailwind-select
            class="editor-heading-select w-38"
            [ariaLabel]="item.ariaLabel"
            [size]="size()"
            [options]="headingOptions"
            [value]="blockFormat()"
            [disabled]="disabled()"
            (valueChange)="onHeadingChange($event)" />
        } @else {
          <tailwind-button
            type="button"
            [kind]="isActive(item.command) ? 'flat' : 'ghost'"
            [color]="isActive(item.command) ? 'secondary' : 'transparent'"
            [size]="size()"
            [icon]="item.icon"
            [disabled]="disabled()"
            [ariaLabel]="item.ariaLabel"
            [attr.aria-pressed]="isActive(item.command) ? 'true' : 'false'"
            (onClick)="onCommand(item.command, $event)" />
        }
      }
    </div>
    @if (!lastGroup) {
      <tailwind-divider orientation="vertical" class="mx-1 h-7 self-center" />
    }
  }
</div>
