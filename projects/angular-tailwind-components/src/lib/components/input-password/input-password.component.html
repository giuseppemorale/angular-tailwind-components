<div class="tailwind-input-password-wrapper flex flex-col gap-1.5">
  @if (label()) {
    <label
      [attr.for]="id() ? id() + '-inner' : null"
      class="text-sm font-medium text-neutral-700"
      [class.text-danger-600]="hasError()">
      {{ label() }}
    </label>
  }

  <div class="relative">
    <input
      [attr.id]="id() ? id() + '-inner' : null"
      [type]="inputType()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      autocomplete="current-password"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="(helperText() || errorText() || feedback()) && id() ? id() + '-helper' : null"
      [value]="value()"
      [class]="inputClasses()"
      (input)="onInputChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()" />

    @if (toggleMask()) {
      <button
        type="button"
        class="absolute right-2 top-1/2 -translate-y-1/2 inline-flex items-center justify-center rounded-md p-1 text-neutral-500 hover:text-neutral-700 focus:outline focus:outline-offset-2 focus:outline-primary-500 disabled:pointer-events-none disabled:opacity-50"
        [attr.aria-label]="toggleAriaLabel()"
        [disabled]="isDisabled()"
        (mousedown)="$event.preventDefault()"
        (click)="toggleMaskVisibility()">
        <tailwind-icon [icon]="toggleIcon()" [size]="16" />
      </button>
    }
  </div>

  @if (helperText() && !hasError()) {
    <p [attr.id]="id() ? id() + '-helper' : null" class="text-xs text-neutral-500">
      {{ helperText() }}
    </p>
  }
  @if (errorText() && hasError()) {
    <p [attr.id]="id() ? id() + '-helper' : null" class="text-xs text-danger-600">
      {{ errorText() }}
    </p>
  }
</div>

<ng-template #feedbackPanelTemplate>
  <div
    class="w-max min-w-48 max-w-xl rounded-lg border border-neutral-200 bg-white p-3 shadow-lg"
    role="region"
    [attr.aria-label]="resolvedLabels().prompt">
    <p class="mb-2 text-xs font-medium text-neutral-700">{{ resolvedLabels().prompt }}</p>
    <div class="flex w-56 max-w-full gap-1" role="img" [attr.aria-label]="strengthLabel()">
      @for (segmentClass of meterSegmentClasses(); track $index) {
        <span class="h-1.5 flex-1 rounded-full transition-colors duration-150" [class]="segmentClass"></span>
      }
    </div>
    <p [attr.id]="id() ? id() + '-helper' : null" class="mt-2 text-xs text-neutral-600" aria-live="polite">
      {{ strengthLabel() }}
    </p>
  </div>
</ng-template>
