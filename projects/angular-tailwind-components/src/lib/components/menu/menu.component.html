<ng-template #panelTemplate>
  <div
    #panel
    role="menu"
    [class]="mergeClasses('bg-surface rounded-overlay border border-border shadow-lg py-1 animate-overlay-in')"
    (keydown)="onPanelKeydown($event)">
    @for (item of items(); track $index) {
      @if (item.divider) {
        <hr class="my-1 border-neutral-100" />
      } @else {
        <button
          type="button"
          role="menuitem"
          [disabled]="!!item.disabled"
          class="w-full text-left px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50 hover:text-fg disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-150 ease-in-out cursor-pointer"
          (click)="selectItem(item)">
          {{ item.label }}
        </button>
      }
    }
  </div>
</ng-template>
