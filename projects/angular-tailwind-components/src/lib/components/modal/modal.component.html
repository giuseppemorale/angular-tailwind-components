@if (isOpen()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-black/50 backdrop-blur-sm z-1040 transition-opacity duration-200"
    [class.opacity-100]="isVisible()"
    [class.opacity-0]="!isVisible()"
    (click)="closeOnBackdrop() && close()"
    aria-hidden="true"></div>

  <!-- Modal -->
  <div
    role="dialog"
    class="fixed inset-0 z-1050 overflow-y-auto"
    [attr.aria-modal]="true"
    [attr.aria-labelledby]="subId('title')"
    (keydown.escape)="closeOnEscape() && close()">
    <div class="flex min-h-full items-center justify-center p-4">
      <div #modalPanel [class]="panelClasses()" tabindex="-1" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-neutral-200">
          <h2 [attr.id]="subId('title')" class="text-lg font-semibold text-neutral-900 pr-2">
            <ng-content />
          </h2>
          @if (showCloseButton()) {
            <tailwind-button
              kind="ghost"
              color="transparent"
              icon="x-mark"
              class="shrink-0 -m-1.5"
              [ariaLabel]="resolvedCloseLabel()"
              (onClick)="close()" />
          }
        </div>

        <!-- Body -->
        <div class="px-6 py-5">
          <ng-content select="[tailwind-modal-content]" />
        </div>

        <!-- Footer: collapses entirely when nothing is projected into the slot -->
        <div class="border-t border-neutral-200 px-6 py-4 [&:not(:has(*))]:hidden">
          <ng-content select="[tailwind-modal-footer]" />
        </div>
      </div>
    </div>
  </div>
}
