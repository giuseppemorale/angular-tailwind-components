<div [class]="computedClasses()" role="alert">
  <div class="flex-1 min-w-0">
    @if (title()) {
      <p class="text-sm font-semibold mb-0.5">{{ title() }}</p>
    }
    <p class="text-sm"><ng-content /></p>
    @if (showActions()) {
      <div class="pt-3">
        <ng-content select="[tailwind-notification-actions]" />
      </div>
    }
  </div>
  @if (dismissible()) {
    <tailwind-button
      kind="ghost"
      color="neutral"
      size="sm"
      icon="x-mark"
      class="shrink-0 -m-1"
      ariaLabel="Dismiss"
      (onClick)="onDismiss.emit()" />
  }
</div>
