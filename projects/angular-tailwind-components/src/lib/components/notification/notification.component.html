<div [class]="computedClasses()" role="alert">
  <div class="flex-1 min-w-0">
    @if (title()) {
      <p class="text-sm font-semibold mb-0.5">{{ title() }}</p>
    }
    <p class="text-sm"><ng-content /></p>
    @if (showActions()) {
      <div class="pt-3">
        <ng-content select="[tailwind-notification-actions]" />
      </div>
    }
  </div>
  @if (dismissible()) {
    <button
      type="button"
      (click)="onDismiss.emit()"
      class="shrink-0 p-1 -m-1 rounded-lg opacity-60 hover:opacity-100 transition-opacity cursor-pointer"
      aria-label="Dismiss">
      <tailwind-icon icon="x-mark" [size]="16" class="shrink-0" />
    </button>
  }
</div>
