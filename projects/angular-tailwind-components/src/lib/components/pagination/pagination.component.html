<div class="flex flex-wrap items-center justify-between gap-4 w-full">
  <div class="flex flex-wrap items-center gap-3 min-w-0">
    @if (summary()) {
      <span class="text-sm text-neutral-700 dark:text-neutral-300">
        {{ summaryText() }}
      </span>
    }

    @if (lengthOptions().length > 0) {
      <div class="w-20 shrink-0">
        <tailwind-select
          size="sm"
          ariaLabel="Rows per page"
          [options]="pageSizeSelectOptions()"
          [value]="pageSize()"
          (valueChange)="onPageSizeValueChange($event)" />
      </div>
    }
  </div>

  <nav [attr.aria-label]="ariaLabel()" class="flex items-center gap-1">
  <!-- Previous -->
    <tailwind-button
      kind="ghost"
      color="neutral"
      size="sm"
      icon="chevron-left"
      [disabled]="currentPage() <= 1"
      ariaLabel="Previous page"
      (onClick)="goToPage(currentPage() - 1)" />

    @for (page of visiblePages(); track page) {
      <tailwind-button
        size="sm"
        [kind]="page === currentPage() ? 'flat' : 'ghost'"
        [color]="page === currentPage() ? 'blue' : 'neutral'"
        class="min-w-8"
        [ariaLabel]="pageButtonAriaLabel(page)"
        (onClick)="goToPage(page)">
        {{ page }}
      </tailwind-button>
    }

    <!-- Next -->
    <tailwind-button
      kind="ghost"
      color="neutral"
      size="sm"
      icon="chevron-right"
      [disabled]="currentPage() >= totalPages()"
      ariaLabel="Next page"
      (onClick)="goToPage(currentPage() + 1)" />
  </nav>
</div>
