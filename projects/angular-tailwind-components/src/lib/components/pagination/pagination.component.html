<div [class]="mergeClasses('flex flex-wrap items-center justify-between gap-4 w-full')">
  <div class="flex flex-wrap items-center gap-3 min-w-0">
    @if (summary()) {
      <span class="text-sm text-neutral-700 dark:text-neutral-300">
        {{ summaryText() }}
      </span>
    }

    @if (lengthOptions().length > 0) {
      <div class="w-20 shrink-0">
        <tailwind-select
          [ariaLabel]="rowsPerPageLabel()"
          [options]="pageSizeSelectOptions()"
          [value]="pageSize()"
          (valueChange)="onPageSizeValueChange($event)" />
      </div>
    }
  </div>

  <nav [attr.aria-label]="navAriaLabel()" class="flex items-center gap-1">
    <!-- Previous -->
    <tailwind-button
      kind="ghost"
      color="transparent"
      icon="chevron-left"
      [disabled]="currentPage() <= 1"
      [ariaLabel]="previousPageLabel()"
      (onClick)="goToPage(currentPage() - 1)" />

    @for (page of visiblePages(); track $index) {
      @if (page === null) {
        <span class="px-1 text-sm text-neutral-500 select-none" aria-hidden="true">…</span>
      } @else {
        <tailwind-button
          [kind]="page === currentPage() ? 'flat' : 'ghost'"
          [color]="page === currentPage() ? 'primary' : 'secondary'"
          class="min-w-8"
          [ariaCurrent]="page === currentPage() ? 'page' : undefined"
          [ariaLabel]="pageButtonAriaLabel(page)"
          (onClick)="goToPage(page)">
          {{ page }}
        </tailwind-button>
      }
    }

    <!-- Next -->
    <tailwind-button
      kind="ghost"
      color="transparent"
      icon="chevron-right"
      [disabled]="currentPage() >= totalPages()"
      [ariaLabel]="nextPageLabel()"
      (onClick)="goToPage(currentPage() + 1)" />
  </nav>
</div>
