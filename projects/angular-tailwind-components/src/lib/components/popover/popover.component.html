<ng-template #panelTemplate>
  <div
    #panel
    role="dialog"
    tabindex="-1"
    [attr.id]="subId('panel')"
    [attr.aria-labelledby]="title() ? subId('title') : null"
    [attr.aria-label]="title() ? null : ariaLabel() || null"
    [class]="
      mergeClasses(
        'max-w-xs rounded-xl border border-neutral-200 bg-surface p-4 shadow-lg animate-in fade-in zoom-in-95'
      )
    ">
    @if (title() || showCloseButton()) {
      <div class="mb-2 flex items-start justify-between gap-3">
        @if (title()) {
          <h3 [attr.id]="subId('title')" class="text-sm font-semibold text-neutral-900">{{ title() }}</h3>
        }
        @if (showCloseButton()) {
          <button
            type="button"
            class="-m-1 shrink-0 rounded-sm p-1 text-neutral-400 hover:text-neutral-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 cursor-pointer"
            [attr.aria-label]="closeLabel()"
            (click)="close()">
            <span aria-hidden="true">&times;</span>
          </button>
        }
      </div>
    }

    <div class="text-sm text-neutral-700">
      <ng-content />
    </div>
  </div>
</ng-template>
