<div [class]="mergeClasses('tailwind-segmented-control flex flex-col gap-1.5')">
  @if (label()) {
    <span [attr.id]="subId('label')" class="text-sm font-medium text-neutral-700">{{ label() }}</span>
  }

  <div
    role="radiogroup"
    [class]="containerClasses()"
    [attr.aria-labelledby]="label() ? subId('label') : null"
    [attr.aria-label]="label() ? null : ariaLabel() || null"
    (keydown)="onKeydown($event)">
    @for (option of options(); track option.value) {
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="isSelected(option)"
        [attr.tabindex]="isSelected(option) ? 0 : -1"
        [disabled]="isDisabled() || !!option.disabled"
        [class]="segmentClasses(option)"
        (click)="select(option)">
        {{ option.label }}
      </button>
    }
  </div>
</div>
