<div [class]="mergeClasses('tailwind-table w-full')">
  <div class="tw-table-toolbar flex flex-wrap items-end justify-between gap-4 pb-3">
    @if (searchable()) {
      <div class="max-w-xs shrink-0">
        <tailwind-input
          [label]="searchLabelText()"
          type="search"
          [placeholder]="searchPlaceholderText()"
          [value]="searchQuery()"
          (valueChange)="onSearchChange($event)" />
      </div>
    }
    <div class="flex flex-wrap items-center gap-2 min-w-0" [class.ml-auto]="searchable()">
      <ng-content select="[tailwind-table-tools]" />
    </div>
  </div>
  <!--
    No frame around the table: the rules live between the rows, not around them. `bg-surface` stays
    so the sticky header has an opaque plane to paint on, and so the table reads as a surface on a
    tinted page.
  -->
  <div class="tw-table-shell w-full bg-surface">
    @if (loading()) {
      <div class="px-4 py-2" role="status" [attr.aria-label]="loadingText()">
        @for (row of skeletonRows; track row) {
          <div class="flex items-center gap-4 py-3" [class.border-t]="!$first" [class.border-border]="!$first">
            @for (cell of skeletonCells(); track $index) {
              <div class="min-w-0 flex-1">
                <tailwind-skeleton variant="text" [width]="cell" />
              </div>
            }
          </div>
        }
      </div>
    } @else {
      <div class="tw-table-scroll overflow-x-auto" [class.tw-table-sticky]="stickyHeader()">
        <!-- `table-auto` + `w-max min-w-full`: colonne in base al contenuto; scroll orizzontale se serve. -->
        <table
          class="w-max min-w-full table-auto text-sm text-left divide-y divide-border"
          [class.tw-table-flush]="!showPagination()">
          <ng-content select="thead" />
          @for (ctx of rowContexts(); track ctx.dataIndex) {
            <ng-container *ngTemplateOutlet="rowTemplate().templateRef; context: ctx" />
          } @empty {
            <tbody>
              <tr>
                <td [attr.colspan]="emptyColspan()">
                  {{ emptyMessageText() }}
                </td>
              </tr>
            </tbody>
          }
        </table>
      </div>

      @if (showPagination()) {
        <div class="px-4 py-3">
          <tailwind-pagination
            [totalItems]="totalItems()"
            [pageSize]="pageSize()"
            (pageSizeChange)="setPageSize($event)"
            [lengthOptions]="paginationLengthOptions()"
            [currentPage]="currentPage()"
            (pageChange)="goToPage($event)"
            [ariaLabel]="pagination()?.ariaLabel ?? ''"
            [summary]="paginationSummary()">
          </tailwind-pagination>
        </div>
      }
    }
  </div>
</div>
