<div [class]="mergeClasses('tailwind-tab-group w-full')">
  <!-- Tab Headers -->

  <div class="border-b border-neutral-200" [class.flex]="scrollable()" [class.items-stretch]="scrollable()">
    @if (scrollable()) {
      <tailwind-button
        kind="ghost"
        color="transparent"
        icon="chevron-left"
        class="tailwind-tab-scroll-btn--start shrink-0 self-stretch rounded-none"
        [disabled]="!canScrollStart()"
        [ariaLabel]="scrollLeftLabel()"
        (click)="scrollTabs(-1)" />
    }

    <nav
      #tabList
      class="tailwind-tab-list flex -mb-px gap-1"
      [class.w-full]="stretch() && !scrollable()"
      [class.flex-1]="scrollable()"
      [class.min-w-0]="scrollable()"
      [class.tailwind-tab-list--scrollable]="scrollable()"
      role="tablist"
      [attr.aria-label]="ariaLabel() || null"
      (wheel)="onTabListWheel($event)"
      (keydown)="onTabListKeydown($event)"
      (scroll)="onTabListScroll()">
      @for (tab of tabs(); track $index; let i = $index) {
        <button
          type="button"
          role="tab"
          [attr.id]="tab.tabId()"
          [attr.aria-selected]="activeIndex() === i"
          [attr.aria-controls]="tab.panelId()"
          [attr.tabindex]="activeIndex() === i ? 0 : -1"
          [disabled]="tab.disabled()"
          [class]="tabButtonClass(i, tab.disabled())"
          (click)="!tab.disabled() && selectTab(i)">
          {{ tab.label() }}

          <span [class]="tabIndicatorClass(i)"></span>
        </button>
      }
    </nav>

    @if (scrollable()) {
      <tailwind-button
        kind="ghost"
        color="transparent"
        icon="chevron-right"
        class="tailwind-tab-scroll-btn--end shrink-0 self-stretch rounded-none"
        [disabled]="!canScrollEnd()"
        [ariaLabel]="scrollRightLabel()"
        (click)="scrollTabs(1)" />
    }
  </div>

  <!-- Tab Content -->

  <div class="pt-4">
    <ng-content />
  </div>
</div>
