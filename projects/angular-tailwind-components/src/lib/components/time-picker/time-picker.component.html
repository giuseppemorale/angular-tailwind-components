<div [class]="mergeClasses('flex flex-col gap-1.5')">
  @if (label()) {
    <label [attr.for]="subId('inner')" class="text-sm font-medium text-neutral-700">{{ label() }}</label>
  }
  <div class="relative">
    <input
      [attr.id]="subId('inner')"
      type="text"
      readonly
      [value]="displayValue()"
      [placeholder]="i18n.placeholder"
      [disabled]="isDisabled()"
      class="block w-full bg-surface border border-border-strong field-depth rounded-control h-9 px-3 text-sm text-fg placeholder:text-neutral-400 transition-[color,background-color,border-color,box-shadow] duration-150 ease-in-out outline-none focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-ring focus:border-ring cursor-pointer disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-fg-muted pr-10"
      (click)="togglePanel()" />
    <tailwind-icon
      icon="clock"
      [size]="16"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none" />

    @if (showPanel()) {
      <div
        class="absolute left-0 top-full z-popover mt-1 w-52 rounded-overlay border border-border bg-surface p-4 shadow-xl animate-overlay-in">
        <div class="flex items-center gap-2">
          <select
            class="flex-1 min-w-0 block bg-surface border border-border-strong field-depth rounded-control h-9 px-2 text-sm text-fg tabular-nums transition-[color,background-color,border-color,box-shadow] duration-150 ease-in-out outline-none focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-ring focus:border-ring disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-fg-muted"
            [disabled]="isDisabled()"
            (change)="onHourChange($event)">
            @for (h of hours; track h) {
              <option [value]="h" [selected]="h === (draft()?.h ?? 0)">
                {{ h.toString().padStart(2, '0') }}
              </option>
            }
          </select>
          <span class="text-neutral-400 text-sm shrink-0">:</span>
          <select
            class="flex-1 min-w-0 block bg-surface border border-border-strong field-depth rounded-control h-9 px-2 text-sm text-fg tabular-nums transition-[color,background-color,border-color,box-shadow] duration-150 ease-in-out outline-none focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-ring focus:border-ring disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-fg-muted"
            [disabled]="isDisabled()"
            (change)="onMinuteChange($event)">
            @for (m of minutes; track m) {
              <option [value]="m" [selected]="m === (draft()?.m ?? 0)">
                {{ m.toString().padStart(2, '0') }}
              </option>
            }
          </select>
        </div>
        <div class="mt-2 pt-2 border-t border-neutral-100 flex items-center justify-between gap-2">
          <tailwind-button kind="text" color="primary" size="xs" [disabled]="isDisabled()" (click)="goToNow()">
            {{ i18n.now }}
          </tailwind-button>
          <tailwind-button kind="solid" color="primary" [disabled]="isDisabled()" (click)="apply()">
            {{ i18n.apply }}
          </tailwind-button>
        </div>
      </div>
    }
  </div>
</div>
