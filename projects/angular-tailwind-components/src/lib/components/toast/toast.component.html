<div class="fixed bottom-4 right-4 z-1080 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div [class]="toastClasses(toast.color ?? 'sky')" role="alert">
      <div class="flex-1 min-w-0">
        @if (toast.title) {
          <p class="text-sm font-semibold mb-0.5">{{ toast.title }}</p>
        }
        <p class="text-sm">{{ toast.message }}</p>
      </div>
      @if (toast.dismissible) {
        <tailwind-button
          kind="ghost"
          color="neutral"
          size="sm"
          icon="x-mark"
          class="shrink-0 opacity-60 hover:opacity-100"
          ariaLabel="Dismiss"
          (onClick)="toastService.dismiss(toast.id)" />
      }
    </div>
  }
</div>
