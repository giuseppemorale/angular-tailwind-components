<div [class]="containerClasses()">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto rounded-xl border shadow-lg p-4 flex gap-3 animate-in duration-300"
      [class]="enterAnimationClass() + ' ' + surfaceClass(toast.color)"
      role="alert">
      <div class="flex-1 min-w-0">
        @if (toast.title || toast.icon) {
          <div class="flex items-center gap-2 mb-0.5">
            @if (toast.icon) {
              <tailwind-icon [icon]="toast.icon" [size]="20" [class]="iconClass(toast.color)" />
            }
            @if (toast.title) {
              <p class="text-sm font-semibold min-w-0">{{ toast.title }}</p>
            }
          </div>
        }
        <p class="text-sm">{{ toast.message }}</p>
      </div>
      @if (toast.dismissible) {
        <tailwind-button
          kind="ghost"
          color="transparent"
          icon="x-mark"
          class="shrink-0 opacity-60 hover:opacity-100"
          ariaLabel="Dismiss"
          (onClick)="toastService.dismiss(toast.id)" />
      }
    </div>
  }
</div>
